name: Auto Daily Commit

on:
    schedule:
        # GitHub delays or drops runs that start exactly on the hour, so use
        # off-peak minutes and several runs per day. Extra runs are harmless.
        - cron: "23 6 * * *"
        - cron: "41 10 * * *"
        - cron: "13 14 * * *"
        - cron: "37 18 * * *"
        - cron: "53 21 * * *"
    workflow_dispatch: # Allows manual triggering from Actions tab

permissions:
    contents: write

concurrency:
    group: auto-daily-commit
    cancel-in-progress: false

jobs:
    auto-commit:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update activity timestamp
              run: |
                  mkdir -p .github
                  echo "Last activity: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/activity.txt

            - name: Commit and push changes
              run: |
                  git config --global user.name "bezriche-ramy"
                  git config --global user.email "ramybezriche@gmail.com"
                  git add .github/activity.txt

                  # Only commit and push if there are changes
                  if ! git diff --staged --quiet; then
                    git commit -m "chore(activity): daily contribution [skip ci]"
                    git pull --rebase origin main
                    git push origin main
                  fi
